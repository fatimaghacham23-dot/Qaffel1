name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production-hardening

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SUPABASE_SERVICE_ROLE_KEY: local-ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PRICE_SOLO: price_ci_solo
      STRIPE_PRICE_TEAM: price_ci_team
      STRIPE_PRICE_BUSINESS: price_ci_business
      STRIPE_PRICE_ENTERPRISE: price_ci_enterprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run security:audit:all
        continue-on-error: true
      - run: npm run migrations:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  database-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase migration list --local
      - run: supabase db lint --local --level warning
      - if: always()
        run: supabase stop --no-backup

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
